
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Alunos</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<main class="container">

    <header>
        <h1>Cadastro de Alunos</h1>
        <p>Gerencie os dados dos alunos</p>
    </header>

    <!-- CADASTRAR -->
    <section class="card">
        <h2>Cadastrar aluno</h2>

        <form id="aluno-form">

            <label for="nome">Nome</label>
            <input type="text" id="nome"
                   placeholder="Digite o nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email"
                   placeholder="Digite o e-mail" required>

            <label for="nota">Nota escolar</label>
            <input type="number" id="nota"
                   placeholder="Digite a nota (0 a 10)"
                   min="0" max="10" step="0.01" required>

            <button type="submit">Cadastrar aluno</button>

        </form>
    </section>

    <!-- BUSCAR -->
    <section class="card">
        <h2>Buscar aluno</h2>

        <form id="busca-form">

            <label for="email-busca">E-mail do aluno</label>
            <input type="email" id="email-busca"
                   placeholder="Digite o e-mail" required>

            <button type="submit">Buscar aluno</button>

        </form>

        <div id="resultado-busca"></div>
    </section>

    <!-- ATUALIZAR -->
    <section class="card">
        <h2>Atualizar aluno</h2>

        <form id="atualizar-form">

            <label for="email-original">E-mail atual do aluno</label>
            <input type="email" id="email-original"
                   placeholder="Digite o e-mail cadastrado" required>

            <label for="novo-nome">Novo nome</label>
            <input type="text" id="novo-nome"
                   placeholder="Deixe vazio se não quiser alterar">

            <label for="novo-email">Novo e-mail</label>
            <input type="email" id="novo-email"
                   placeholder="Deixe vazio se não quiser alterar">

            <label for="nova-nota">Nova nota</label>
            <input type="number" id="nova-nota"
                   placeholder="Deixe vazio se não quiser alterar"
                   min="0" max="10" step="0.01">

            <button type="submit">Atualizar aluno</button>

        </form>
    </section>

    <!-- EXCLUIR -->
    <section class="card">
        <h2>Excluir aluno</h2>

        <form id="excluir-form">

            <label for="email-excluir">E-mail do aluno</label>
            <input type="email" id="email-excluir"
                   placeholder="Digite o e-mail" required>

            <button type="submit">Excluir aluno</button>

        </form>
    </section>

    <p id="mensagem" class="mensagem"></p>

</main>

<script src="./script.js"></script>

</body>
</html>
